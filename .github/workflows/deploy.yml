# Builds the landing page and deploys it to Azure Static Web Apps.
#
# The build and bicep jobs run for every pull request, including ones from
# forks. Only the deploy jobs are restricted, because GitHub does not expose
# secrets to fork workflows and this repository expects contributions from
# people who are not members: an unguarded deploy job would fail on every
# external pull request. Dependabot's pull requests are held back from the
# deploy jobs for the same reason: GitHub runs them without the deploy token.
#
# Every action is pinned to a commit, with its version in the comment beside
# it. Dependabot keeps both current.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
      - 'MANIFESTO.md'
      - 'PRINCIPLES.md'
      - 'SIGNATORIES.md'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'web/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
      - 'MANIFESTO.md'
      - 'PRINCIPLES.md'
      - 'SIGNATORIES.md'
  # Started by hand from the Actions tab, to deploy production without a code
  # change. GitHub skips the push run when it cannot list the changed files,
  # which happens after a force push, and this covers that case too.
  workflow_dispatch:

concurrency:
  # One run at a time per event and ref, and nothing is ever cancelled. An
  # expression that cancelled only pull request runs was tried on 6 September
  # 2026 and removed the same day: merging two pull requests inside a minute
  # left four runs cancelling each other in turn, both production deploys
  # among them. A queue costs a few minutes. A half-uploaded site costs more.
  group: deploy-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      # Building here rather than letting Oryx build inside the deploy action
      # means a type error fails the pull request instead of the deployment.
      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  bicep:
    name: Validate Bicep
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # az is preinstalled on the runner and this needs no Azure credentials.
      - name: Compile templates
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  deploy:
    name: Deploy
    needs: build
    # Dependabot's own pull requests come from this repository, so the fork
    # guard lets them through, but GitHub runs them without the deploy token
    # and the upload would fail. They still get the build and bicep checks.
    if: >-
      github.event.action != 'closed' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.swa.outputs.static_web_app_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      - name: Upload to Static Web Apps
        id: swa
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          # Lets the action post the preview URL as a pull request comment.
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_preview:
    name: Close preview environment
    # Free tier allows three staging environments, so they have to be reclaimed.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
